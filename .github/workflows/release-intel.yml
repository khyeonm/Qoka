# Cross-arch installers for an existing app tag: Intel macOS (.dmg + .zip) AND
# Windows on ARM (win32 arm64 .exe), published to a SEPARATE release (default
# title "intel winarm") so the main qoka-v* release (Apple Silicon .dmg + Windows
# x64 .exe) is NEVER touched.
#
# Manual only (workflow_dispatch). The app SOURCE is cloned from a FIXED tag
# (source_tag), so the build reflects exactly that tree - never this branch.
#
# The release_tag deliberately does NOT match release-app.yml's `qoka-v*` trigger
# glob, so creating it can never kick off the normal arm64-.dmg / x64-.exe build.
#
# macOS Intel: cross-built on the macos-14 (arm64) runner - host node stays arm64
# while npm_config_arch=x64 targets Intel (GitHub's macos-13 Intel runner hangs);
# signed + notarized when the Apple secrets are present (same path as release-app).
# Windows ARM64: native windows-11-arm runner, UNSIGNED (SmartScreen warns ->
# More info -> Run anyway). Cross-arch behaviour is not validated on real hardware.
name: Release (Intel macOS + Windows ARM64)

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing app tag to build from (the source tree).'
        default: 'qoka-v0.4.10'
        required: true
      release_tag:
        description: 'Tag for THIS release. Must NOT match qoka-v* or it would trigger the normal build.'
        default: 'qoka-0.4.10-intel'
        required: true
      release_title:
        description: 'Release name shown on GitHub.'
        default: 'intel winarm'
        required: true

permissions:
  contents: write

jobs:
  # Ensure the separate cross-arch release exists (no-op re-run guard).
  init:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve source tag -> commit SHA
        id: resolve
        shell: bash
        run: |
          SHA="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" \
                 "refs/tags/${{ inputs.source_tag }}" | cut -f1)"
          if [ -z "$SHA" ]; then
            echo "::error::Source tag ${{ inputs.source_tag }} not found on origin."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Create the release if missing
        shell: bash
        run: |
          gh release create "${{ inputs.release_tag }}" \
            --target "${{ steps.resolve.outputs.sha }}" \
            --title "${{ inputs.release_title }}" \
            --notes "Cross-arch installers for ${{ inputs.source_tag }} (Intel macOS + Windows ARM64). Windows is unsigned; cross-arch behaviour not validated on native hardware." \
            2>/dev/null || echo "Release ${{ inputs.release_tag }} already exists - reusing it."

  # Intel macOS (.dmg + .zip), cross-built on the arm64 runner and signed/notarized.
  build-mac-intel:
    needs: [init]
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      # Cross-build Intel on the arm64 host: host node is arm64, target modules x64.
      npm_config_arch: x64
      npm_config_target_arch: x64
    steps:
      - name: Clone the source tag
        shell: bash
        run: git clone --depth 1 --branch "${{ inputs.source_tag }}" "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" .

      - name: Install Node from .nvmrc (macOS arm64 host)
        shell: bash
        run: |
          V="$(tr -d '[:space:]' < .nvmrc)"
          F="node-v$V-darwin-arm64"
          curl -fsSL "https://nodejs.org/dist/v$V/$F.tar.xz" | tar -xJ
          echo "$PWD/$F/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        run: |
          ulimit -n 65536 2>/dev/null || ulimit -n 10240 2>/dev/null || true
          npm install

      - name: Inject Qoka API key into extensions
        shell: bash
        env:
          QOKA_API_KEY: ${{ secrets.QOKA_API_KEY }}
        run: |
          set -e
          if [ -z "$QOKA_API_KEY" ]; then
            echo "WARNING: QOKA_API_KEY secret is empty - gated server calls (methods/hypothesis) will 403." >&2
          fi
          for ext in aria-hypothesis aria-methods-search; do
            printf "export const QOKA_API_KEY = '%s';\n" "$QOKA_API_KEY" \
              > "extensions/$ext/src/qokaKey.ts"
          done
          echo "Injected Qoka API key into aria-hypothesis, aria-methods-search."

      - name: Build Qoka extensions
        shell: bash
        run: |
          set -e
          ulimit -n 65536 2>/dev/null || ulimit -n 10240 2>/dev/null || true
          transpile_tasks=""
          for d in extensions/aria-*/ extensions/qoka-*/; do
            name="$(basename "$d")"
            if [ -f "$d/build.mjs" ]; then
              echo "== $name (esbuild) =="
              (cd "$d" && npm install && node build.mjs)
            elif [ -f "$d/tsconfig.json" ]; then
              transpile_tasks="$transpile_tasks transpile-extension:$name"
            fi
          done
          if [ -n "$transpile_tasks" ]; then
            echo "== gulp$transpile_tasks =="
            npm run gulp -- $transpile_tasks
          fi

      - name: Build app tree (darwin x64)
        shell: bash
        run: |
          ulimit -n 65536 2>/dev/null || ulimit -n 10240 2>/dev/null || true
          npm run gulp vscode-darwin-x64-min

      # Sign + notarize with the Apple Developer ID (same path as release-app.yml).
      # Skipped automatically if the secret is absent (then ships unsigned).
      - name: Import Apple signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "APPLE_CERTIFICATE not set - shipping UNSIGNED."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/buildagent.keychain"
          KCPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning -v "$KEYCHAIN"

      - name: Sign Qoka.app
        if: env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
          VSCODE_ARCH: x64
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -e
          node --experimental-strip-types build/darwin/sign.ts "$PWD/.."

      - name: Package macOS (.dmg)
        shell: bash
        env:
          VSCODE_ARCH: x64
          VSCODE_QUALITY: stable
        run: |
          mkdir -p artifacts
          node --experimental-strip-types build/darwin/create-dmg.ts "$PWD/.." "$PWD/artifacts"

      - name: Notarize, staple, and zip the app
        if: env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          DMG="$(ls artifacts/*.dmg | head -1)"
          APP="$PWD/../VSCode-darwin-x64/Qoka.app"
          n=0
          until [ "$n" -ge 3 ]; do
            if xcrun notarytool submit "$DMG" \
                 --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" \
                 --no-s3-acceleration --wait; then
              break
            fi
            n=$((n+1)); echo "notarytool attempt $n failed, retrying…"; sleep 15
          done
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          xcrun stapler staple "$APP" || true
          ditto -c -k --keepParent "$APP" "artifacts/Qoka-darwin-x64.zip"

      - name: Upload installers to the release
        shell: bash
        run: |
          for f in artifacts/*; do gh release upload "${{ inputs.release_tag }}" "$f" --clobber; done

  # Windows on ARM (win32 arm64) - native runner, unsigned.
  build-winarm:
    needs: [init]
    # Native ARM64 Windows runner - host==target==arm64, so no cross-compile.
    runs-on: windows-11-arm
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # @vscode/ripgrep (and other prebuilt downloaders) query the GitHub API;
      # unauthenticated CI hits the 60/hr limit and 403s. Authenticate it.
      GITHUB_TOKEN: ${{ github.token }}
      npm_config_arch: arm64
      npm_config_target_arch: arm64
    steps:
      - name: Clone the source tag
        shell: bash
        run: git clone --depth 1 --branch "${{ inputs.source_tag }}" "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" .

      - name: Install Node from .nvmrc (Windows ARM64)
        shell: pwsh
        run: |
          $V = (Get-Content .nvmrc -Raw).Trim()
          $F = "node-v$V-win-arm64"
          curl.exe -fsSL "https://nodejs.org/dist/v$V/$F.zip" -o node.zip
          Expand-Archive -Path node.zip -DestinationPath . -Force
          "$PWD\$F" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio not found via vswhere" }
          "vs2022_install=$vs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Found Visual Studio at: $vs"

      - name: Add Windows SDK (signtool) to PATH
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\*\signtool.exe" -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match '\\(arm64|x64)\\signtool.exe$' } |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "signtool.exe not found in Windows Kits" }
          Write-Host "Found signtool at: $($sdk.FullName)"
          Split-Path $sdk.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Pin a node-gyp-friendly Python
        shell: pwsh
        run: |
          $py = Get-ChildItem "C:\hostedtoolcache\windows\Python\3.12.*\*\python.exe","C:\hostedtoolcache\windows\Python\3.11.*\*\python.exe" -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
          if ($py) {
            Write-Host "Using Python: $($py.FullName)"
            "npm_config_python=$($py.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "No 3.11/3.12 Python in toolcache; keeping default."
          }
          # Run the postinstall's per-directory npm installs one at a time: parallel
          # child processes can crash the Windows build with 0xC0000409.
          "VSCODE_POSTINSTALL_CONCURRENCY=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Inject Qoka API key into extensions
        shell: bash
        env:
          QOKA_API_KEY: ${{ secrets.QOKA_API_KEY }}
        run: |
          set -e
          if [ -z "$QOKA_API_KEY" ]; then
            echo "WARNING: QOKA_API_KEY secret is empty - gated server calls (methods/hypothesis) will 403." >&2
          fi
          for ext in aria-hypothesis aria-methods-search; do
            printf "export const QOKA_API_KEY = '%s';\n" "$QOKA_API_KEY" \
              > "extensions/$ext/src/qokaKey.ts"
          done
          echo "Injected Qoka API key into aria-hypothesis, aria-methods-search."

      - name: Build Qoka extensions
        shell: bash
        run: |
          set -e
          transpile_tasks=""
          for d in extensions/aria-*/ extensions/qoka-*/; do
            name="$(basename "$d")"
            if [ -f "$d/build.mjs" ]; then
              echo "== $name (esbuild) =="
              (cd "$d" && npm install && node build.mjs)
            elif [ -f "$d/tsconfig.json" ]; then
              transpile_tasks="$transpile_tasks transpile-extension:$name"
            fi
          done
          if [ -n "$transpile_tasks" ]; then
            echo "== gulp$transpile_tasks =="
            npm run gulp -- $transpile_tasks
          fi

      - name: Build app tree
        run: npm run gulp vscode-win32-arm64-min

      - name: Package Windows (.exe)
        shell: bash
        run: |
          npm run gulp vscode-win32-arm64-inno-updater
          npm run gulp vscode-win32-arm64-user-setup
          mkdir -p artifacts
          # Rename so the arch is unmistakable (raw Inno output is QokaSetup.exe
          # with no arch suffix, indistinguishable from the x64 installer).
          src="$(ls .build/win32-arm64/user-setup/*.exe | head -n1)"
          cp "$src" "artifacts/QokaSetup-arm64.exe"

      - name: Upload installer to the release
        shell: bash
        run: gh release upload "${{ inputs.release_tag }}" artifacts/QokaSetup-arm64.exe --clobber
